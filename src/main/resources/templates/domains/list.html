<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(title='Domains', content=~{::main})}">
<main>
  <h1>Domains</h1>
  <table>
    <thead><tr><th>Domain</th><th>DNS</th><th>Status</th></tr></thead>
    <tbody>
      <tr th:each="d : ${domains}">
        <td><a th:href="@{/domains/{id}(id=${d.id})}" th:text="${d.name}"></a></td>
        <td th:text="${d.dnsVerified} ? 'Verified' : 'Pending'"></td>
        <td><div data-vue="BurnStatusBadge" th:attr="data-status=${d.burnStatus}"></div></td>
      </tr>
    </tbody>
  </table>
</main>
</html>
